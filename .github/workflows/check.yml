name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: tokens, contrast, vendor script
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'

      - name: css/tokens.css matches tokens.json
        run: uv run scripts/tokens.py --check

      - name: Contrast of every text and background pair, both themes
        run: uv run scripts/contrast.py

      - name: The contrast check fails on a bad pair
        run: uv run scripts/contrast.py --self-test

      - name: Vendor script parses and refuses to overwrite an edited copy
        run: |
          bash -n scripts/vendor.sh
          bash -n scripts/test-vendor.sh
          scripts/test-vendor.sh
